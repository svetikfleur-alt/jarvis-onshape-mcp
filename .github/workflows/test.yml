name: Tests

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JARVIS_LIVE_TESTS: "0"
      JARVIS_LIVE_MUTATIONS: "0"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check onshape_mcp tests

      - name: Focused request-guard type checking
        run: python -m mypy onshape_mcp/api/request_guard.py

      - name: Offline tests with branch coverage
        run: >-
          python -m pytest -m "not live_onshape" -q --maxfail=1
          --cov=onshape_mcp --cov-branch
          --cov-report=term-missing --cov-fail-under=80
